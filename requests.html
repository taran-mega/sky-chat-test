<!DOCTYPE html>
<html lang = "en">
    
    <!-- HEAD -->
    <head>
        
        <!-- Meta Data -->
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        
        <!-- Title -->
        <title>Requests</title>
        
        <!-- Css -->
        <link rel = "stylesheet" href = "StyleSheets/requests.css">
    </head>
    
    <!-- BODY -->
    <body>
        
        <!-- Container -->
        <main id = "container">
            
            <!-- Panel -->
            <div id = "panel">
                
                <!-- Sent Requests Btn-->
                <button id = "sent" class = "active">
                    Sent
                </button>
                
                <!-- Received Requests Btn -->
                <button id = "received">
                    Received
                </button>
            </div>
            
            <!-- Viweport -->
            <div id = "viewport">
                
                <!-- Slider -->
                <div id = "slider">
                    
                    <!-- Sent Requests -->
                    <div class = "panel" id = "sent">
                        
                        <!-- Main Box -->
                        <div class = "box"></div>
                        
                        <!-- Empty State -->
                        <div class = "empty-state">
                            <div id = "empty-icon">
                                👥
                            </div>
                            <h2>No Request Sent</h2>
                        </div>
                    </div>
                    
                    <!-- Received Requests -->
                    <div class = "panel" id = "received">
                        
                        <!-- Main Box -->
                        <div class = "box"></div>
                        
                        <!-- Empty State -->
                        <div class = "empty-state">
                            <div id = "empty-icon">
                                👥
                            </div>
                            <h2>No Request Received</h2>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Scripts -->
        <script src = "Scripts/config.js"></script>
        <script src = "Scripts/functions.js"></script>
        <script src = "Scripts/requests.js"></script>
    </body>
</html>
