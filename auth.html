<!-- Version Decleration -->
<!DOCTYPE html>
<html lang = "en">

    <!-- HEAD -->
    <head>
        
        <!-- Meta Data -->
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">

        <!-- Title -->
        <title>Login</title>

        <!-- CSS -->
        <link rel = "stylesheet" href = "StyleSheets/Main/auth.css">
    </head>

    <!-- BODY -->
    <body>

        <!-- Container -->
        <main id = "container">
            
            <!-- Box -->
            <section id = "box">

                <!-- Header -->
                <div id = "header">
                    
                    <!-- Heading -->
                    <h1>Welcome</h1>
                    <p>Create your new account</p>
                </div>
                
                <!-- Form -->
                <div id = "loginForm">
                    
                    <!-- Username -->
                    <div class = "input-group">
                        
                        <label for = "username">Username</label>
                        <input
                            type = "text"
                            id = "username"
                            name = "username"
                            placeholder = "Enter your username"
                            autocomplete = "username"
                            required>
                        
                        <!-- Error area -->
                        <div class = "error" id = "username-error"></div>
                    </div>
                    
                    <!-- Password -->
                    <div class = "input-group">
                        
                        <label for = "password">Password</label>
                        <input
                            type = "password"
                            id = "password"
                            name = "password"
                            placeholder = "Enter your password"
                            autocomplete = "current-password"
                            required>
                        
                        <!-- Error Area -->
                        <div class = "error" id = "password-error"></div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button onClick = "sendRequest()" id = "sendBtn">
                        
                        <p>Sign up</p>
                        <div class = "sendingCircle"></div>
                    </button>
                </div>
                
                <!-- Mode change Text -->
                <div id = "toggle-text">
                    <p>Already have an account?</p>
                    
                    <!-- Main button -->
                    <button onClick = "toggleAction()">log in</button>
                </div>
            </section>
        </main>

        <!-- Scripts -->
        <script src = "Scripts/config.js"></script>
        <script src = "Scripts/Main/auth.js"></script>
    </body>
</html>
