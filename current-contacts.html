<!DOCTYPE html>
<html lang = "en">
    
    <!-- HEAD -->
    <head>
        
        <!-- Meta Data -->
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        
        <!-- Title -->
        <title>Contacts</title>
        
        <!-- CSS -->
        <link rel = "stylesheet" href = "StyleSheets/current-contacts.css">
    </head>
    
    <!-- BODY -->
    <body>
        
        <!-- Container -->
        <main id = "container">
            
            <!-- Box -->
            <div id = "box">
                
                <!-- Search -->
                <div id = "search-container">
                    
                    <!-- Search Bar -->
                    <input
                        id = "search-bar"
                        type = "search"
                        placeholder = "Search contacts..."
                        autocomplete = "off"
                    >
                </div>
                
                <!-- Loading Screen -->
                <div id = "loadingScreen">
                    <div class = "loadingCircle"></div>
                </div>
                
                <!-- Main Content -->
                <div id = "main-content">
                    
                    <!-- Contacts -->
                    <section id = "contacts-list"></section>

                    <!-- Empty State -->
                    <div id = "empty-state">
                        <div id = "empty-icon">
                            👥
                        </div>
                        <h2>No contacts</h2>
                        <p>Your contacts will appear here.</p>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Script -->
        <script src = "Scripts/current-contacts.js"></script>
    </body>
</html>
